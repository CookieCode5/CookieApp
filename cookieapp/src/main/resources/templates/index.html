<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Accueil')}"></head>
<body class="bg-cream font-sans text-dark">

<header th:replace="~{fragments/header :: header('accueil')}"></header>

<main>
    <section class="bg-sand">
        <div class="mx-auto max-w-6xl px-6 py-16">
            <h1 class="max-w-2xl text-4xl font-extrabold leading-tight md:text-5xl">
                Cuisinez simplement, <span class="text-primary">dépensez malin.</span>
            </h1>
            <p class="mt-4 max-w-xl text-lg text-dark/80">
                Découvrez les recettes de la communauté CookieApp.
            </p>
            <a th:href="@{/recettes}"
               class="mt-8 inline-block rounded-full bg-primary px-6 py-3 font-semibold text-cream hover:opacity-90">
                Voir toutes les recettes
            </a>
        </div>
    </section>

    <section class="mx-auto max-w-6xl px-6 pt-12">
        <div class="flex items-end justify-between">
            <h2 class="text-2xl font-bold">Dernières recettes</h2>
            <a th:if="${nbRecettes > 0}" th:href="@{/recettes}"
               class="text-sm font-semibold text-primary hover:underline">
                Tout voir (<span th:text="${nbRecettes}">6</span>)
            </a>
        </div>

        <p th:if="${#lists.isEmpty(recettes)}" class="mt-8 rounded-2xl bg-white p-8 text-center text-dark/70">
            Aucune recette pour le moment.
        </p>

        <div th:unless="${#lists.isEmpty(recettes)}"
             class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <th:block th:each="r : ${recettes}">
                <div th:replace="~{fragments/recette-card :: carte(${r})}"></div>
            </th:block>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
