<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${profile.username})}"></head>
<body class="bg-sand font-sans text-dark">

<header th:replace="~{fragments/header :: header('')}"></header>

<main class="mx-auto max-w-6xl px-6 pt-12">
    <h1 class="flex items-center gap-3 text-3xl font-extrabold">
        <span th:text="${profile.username}">Pseudo</span>
        <span th:if="${profile.premium}" class="rounded-full bg-primary px-3 py-1 text-sm text-cream">Premium</span>
    </h1>

    <ul class="mt-3 flex flex-wrap gap-2 text-sm">
        <li th:if="${profile.registrationDate != null}" class="rounded-full bg-white px-3 py-1">
            Membre depuis <span th:text="${#temporals.format(profile.registrationDate, 'dd/MM/yyyy')}"></span>
        </li>
        <li class="rounded-full bg-white px-3 py-1">
            <span th:text="${#lists.size(profile.recipes)}">0</span> recettes publiées
        </li>
        <li class="rounded-full bg-white px-3 py-1">
            Note moyenne reçue :
            <span th:text="${profile.averageReceived != null} ? ${#numbers.formatDecimal(profile.averageReceived, 1, 1)} + ' / 5' : 'aucune note'"></span>
        </li>
    </ul>

    <p th:if="${#lists.isEmpty(profile.recipes)}" class="mt-8 rounded-2xl bg-white p-8 text-center text-dark/70">
        Aucune recette publiée pour le moment.
    </p>

    <div th:unless="${#lists.isEmpty(profile.recipes)}"
         class="mt-6 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <th:block th:each="r : ${profile.recipes}">
            <div th:replace="~{fragments/recipe-card :: carte(${r})}"></div>
        </th:block>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
