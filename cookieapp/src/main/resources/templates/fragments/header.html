<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- Provisoire : sera remplacé par le header de Nylan.
     Ajouter Frigo Magique / Créer une recette / Connexion quand ces routes existent
     (aucun lien ne doit mener à une 404 pendant la démo). -->
<header th:fragment="header(actif)" class="bg-dark text-cream">
    <nav class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
        <a th:href="@{/}" class="flex items-center gap-2 text-xl font-extrabold">
            <span aria-hidden="true">🍪</span> CookieApp
        </a>
        <ul class="flex items-center gap-6 text-sm font-semibold">
            <li>
                <a th:href="@{/}"
                   th:classappend="${actif == 'accueil'} ? 'border-b-2 border-accent pb-1' : 'opacity-80 hover:opacity-100'">
                    Accueil
                </a>
            </li>
            <li>
                <a th:href="@{/recettes}"
                   th:classappend="${actif == 'recettes'} ? 'border-b-2 border-accent pb-1' : 'opacity-80 hover:opacity-100'">
                    Recettes
                </a>
            </li>
        </ul>
        <!-- session.user is the PublicUser put in session by AuthController -->
        <div class="flex items-center gap-4 text-sm font-semibold">
            <th:block th:if="${session.user == null}">
                <a th:href="@{/login}" class="opacity-80 hover:opacity-100">Connexion</a>
                <a th:href="@{/register}" class="rounded-full bg-primary px-4 py-2 text-cream hover:opacity-90">Créer un compte</a>
            </th:block>
            <th:block th:unless="${session.user == null}">
                <a th:if="${session.user.admin}" th:href="@{/admin}" class="opacity-80 hover:opacity-100">Admin</a>
                <a th:href="@{/account}" class="opacity-80 hover:opacity-100">
                    Mon espace
                    <span th:if="${session.user.premium}" class="ml-1 rounded-full bg-accent px-2 py-0.5 text-xs text-dark">Premium</span>
                </a>
                <a th:href="@{/logout}" class="opacity-80 hover:opacity-100">Déconnexion</a>
            </th:block>
        </div>
    </nav>
    <div th:replace="~{fragments/flash :: flash}"></div>
</header>
</html>
