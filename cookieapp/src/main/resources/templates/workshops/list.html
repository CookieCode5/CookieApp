<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ateliers')}"></head>
<body class="bg-sand font-sans text-dark">

<header th:replace="~{fragments/header :: header('ateliers')}"></header>

<main class="mx-auto max-w-6xl px-6 py-12">
    <div class="flex flex-wrap items-end justify-between gap-4">
        <div>
            <h1 class="text-3xl font-extrabold">Cuisiner à plusieurs</h1>
            <p class="mt-2 text-dark/70">Rejoignez une équipe : CookieApp répartit les étapes de la recette entre vous.</p>
        </div>
        <a th:href="@{/workshops/new}"
           class="rounded-full bg-primary px-5 py-2 font-semibold text-cream hover:opacity-90">+ Créer un atelier</a>
    </div>

    <p th:if="${#lists.isEmpty(workshops)}" class="mt-8 rounded-2xl bg-white p-8 text-center text-dark/70">
        Aucun atelier pour le moment.
    </p>

    <div th:unless="${#lists.isEmpty(workshops)}" class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
        <a th:each="w : ${workshops}" th:href="@{/workshops/{id}(id=${w.id})}"
           class="block transition hover:-translate-y-1">
            <article class="flex h-full flex-col overflow-hidden rounded-2xl bg-white shadow-sm ring-1 ring-sand">
                <div class="relative h-40 bg-sand">
                    <img th:if="${w.recipe.imageUrl != null and !w.recipe.imageUrl.isBlank()}"
                         th:src="@{${w.recipe.imageUrl}}" th:alt="${w.recipe.title}" class="h-full w-full object-cover">
                    <div th:unless="${w.recipe.imageUrl != null and !w.recipe.imageUrl.isBlank()}"
                         class="flex h-full w-full items-center justify-center text-5xl" aria-hidden="true">👩‍🍳</div>
                    <span th:if="${#sets.contains(myIds, w.id)}"
                          class="absolute left-3 top-3 rounded-full bg-dark px-3 py-1 text-xs font-semibold text-sand">
                        Mon équipe
                    </span>
                </div>
                <div class="flex flex-1 flex-col gap-2 p-5">
                    <h2 class="text-lg font-bold leading-snug" th:text="${w.title}">Titre de l'atelier</h2>
                    <p class="text-sm text-primary" th:text="'Recette : ' + ${w.recipe.title}">Recette</p>
                    <p class="text-sm text-dark/80">
                        👤 organisé par <span class="font-semibold" th:text="${w.organizer.username}"></span>
                    </p>
                    <p class="mt-auto pt-3 text-sm font-semibold"
                       th:text="${#lists.size(w.team())} + ' cuisinier(s) sur ' + ${w.maxTeamSize()} + ' possible(s)'"></p>
                </div>
            </article>
        </a>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
