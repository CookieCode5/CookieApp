<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${workshop.title})}"></head>
<body class="bg-sand font-sans text-dark">

<header th:replace="~{fragments/header :: header('ateliers')}"></header>

<main class="mx-auto max-w-5xl space-y-8 px-6 py-12">
    <a th:href="@{/workshops}" class="text-sm text-primary hover:underline">← Retour aux ateliers</a>

    <section class="flex flex-wrap items-start justify-between gap-6">
        <div>
            <h1 class="text-3xl font-extrabold" th:text="${workshop.title}">Atelier</h1>
            <p class="mt-2">
                Recette :
                <a th:href="@{/recipes/{id}(id=${workshop.recipe.id})}" class="font-semibold text-primary hover:underline"
                   th:text="${workshop.recipe.title}"></a>
            </p>
            <p class="mt-1 text-sm text-dark/70">
                Organisé par
                <a th:href="@{/users/{id}(id=${workshop.organizer.id})}" class="font-semibold hover:underline"
                   th:text="${workshop.organizer.username}"></a>
                · <span th:text="${#lists.size(workshop.team())}"></span> cuisinier(s)
                sur <span th:text="${workshop.maxTeamSize()}"></span> possible(s)
            </p>
        </div>

        <!-- Join / leave -->
        <div>
            <a th:if="${session.user == null}" th:href="@{/login}"
               class="rounded-full bg-primary px-5 py-2 font-semibold text-cream">Se connecter pour rejoindre</a>
            <p th:if="${isOrganizer}" class="rounded-full bg-white px-4 py-2 text-sm">Vous organisez cet atelier</p>
            <form th:if="${isParticipant}" th:action="@{/workshops/{id}/leave(id=${workshop.id})}" method="post">
                <button class="rounded-full border border-primary px-5 py-2 font-semibold text-primary">Quitter l'équipe</button>
            </form>
            <form th:if="${session.user != null and !isOrganizer and !isParticipant}"
                  th:action="@{/workshops/{id}/join(id=${workshop.id})}" method="post">
                <button th:disabled="${workshop.full}"
                        class="rounded-full bg-primary px-5 py-2 font-semibold text-cream disabled:opacity-50"
                        th:text="${workshop.full} ? 'Équipe complète' : 'Rejoindre l\'équipe'">Rejoindre l'équipe</button>
            </form>
        </div>
    </section>

    <!-- Times: alone vs as a group -->
    <section class="grid gap-4 sm:grid-cols-3">
        <div class="rounded-2xl bg-white p-5 text-center shadow-sm">
            <p class="text-sm text-dark/60">Seul(e)</p>
            <p class="text-3xl font-extrabold"><span th:text="${plan.soloMinutes}"></span> min</p>
        </div>
        <div class="rounded-2xl bg-white p-5 text-center shadow-sm">
            <p class="text-sm text-dark/60">À <span th:text="${#lists.size(plan.cooks)}"></span></p>
            <p class="text-3xl font-extrabold text-primary"><span th:text="${plan.groupMinutes}"></span> min</p>
        </div>
        <div class="rounded-2xl bg-white p-5 text-center shadow-sm">
            <p class="text-sm text-dark/60">Temps gagné</p>
            <p class="text-3xl font-extrabold"><span th:text="${plan.savedMinutes()}"></span> min</p>
        </div>
    </section>

    <!-- Who does what (RG-W2) -->
    <section>
        <h2 class="text-2xl font-bold">Qui fait quoi ?</h2>
        <div class="mt-4 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
            <article th:each="c : ${plan.cooks}" class="rounded-2xl bg-white p-5 shadow-sm"
                     th:classappend="${session.user != null and session.user.id == c.cook().id} ? 'ring-2 ring-primary' : ''">
                <h3 class="flex items-center justify-between font-bold">
                    <span>
                        <span th:text="${c.cook().username}">Pseudo</span>
                        <span th:if="${c.cook().id == workshop.organizer.id}" class="text-xs font-normal text-dark/60">(organisateur)</span>
                    </span>
                    <span class="rounded-full bg-sand px-3 py-1 text-xs" th:text="${c.minutes()} + ' min'"></span>
                </h3>
                <ol class="mt-3 space-y-2 text-sm">
                    <li th:each="s : ${c.steps()}" class="rounded-lg bg-cream p-3">
                        <p class="font-semibold">
                            Étape <span th:text="${s.stepOrder}"></span> : <span th:text="${s.title}"></span>
                            <span th:if="${s.parallelizable}" class="ml-1 text-xs text-primary">⇉ en même temps</span>
                        </p>
                        <p class="mt-1 text-dark/80" th:text="${s.instruction}"></p>
                        <p class="mt-1 text-xs text-dark/60" th:text="${s.durationMinutes} + ' min'"></p>
                    </li>
                </ol>
                <p th:if="${#lists.isEmpty(c.steps())}" class="mt-3 text-sm text-dark/60">Aucune étape attribuée.</p>
            </article>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
