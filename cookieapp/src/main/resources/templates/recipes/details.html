<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${recipe.title})}"></head>
<body class="bg-cream font-sans text-dark">
<header th:replace="~{fragments/header :: header('recettes')}"></header>
<div th:replace="~{fragments/flash :: flash}"></div>

<main class="mx-auto max-w-5xl space-y-10 px-4 py-10">
  <section class="grid gap-8 md:grid-cols-2">
    <img th:if="${recipe.imageUrl}" th:src="@{${recipe.imageUrl}}" th:alt="${recipe.title}"
         class="h-72 w-full rounded-2xl object-cover">
    <div>
      <h1 class="text-3xl font-extrabold" th:text="${recipe.title}">Titre</h1>
      <p class="mt-2 text-dark/70" th:text="${recipe.description}"></p>
      <p class="mt-3 text-sm">par
        <a th:href="@{/users/{id}(id=${recipe.author.id})}" class="font-semibold text-primary"
           th:text="${recipe.author.username}">Auteur</a></p>
      <ul class="mt-4 flex flex-wrap gap-2 text-sm">
        <li class="rounded-full bg-sand px-3 py-1">⏱ <span th:text="${recipe.totalTime()}"></span> min</li>
        <li class="rounded-full bg-sand px-3 py-1" th:text="${recipe.difficulty.libelle}"></li>
        <li class="rounded-full bg-sand px-3 py-1"><span th:text="${recipe.baseServings}"></span> pers.</li>
      </ul>
      <div th:unless="${#sets.isEmpty(recipe.allergens())}" class="mt-4 text-sm">
        <span class="font-semibold">Allergènes :</span>
        <span th:each="a : ${recipe.allergens()}" th:text="${a.name}"
              class="ml-1 rounded-full bg-accent/40 px-2 py-0.5"></span>
      </div>
      <!-- TODO AmiraO (Sprint 3): servings selector + price block -->
    </div>
  </section>

  <section class="grid gap-8 md:grid-cols-3">
    <div>
      <h2 class="text-xl font-bold">Ingrédients</h2>
      <ul class="mt-3 space-y-1">
        <li th:each="line : ${recipe.ingredients}">
          <span th:text="${line.quantity} + ' ' + ${line.unit}"></span>
          <span th:text="${line.ingredient.name}"></span>
          <em th:if="${line.optional}" class="text-dark/60">(facultatif)</em>
        </li>
      </ul>
      <h2 class="mt-6 text-xl font-bold">Ustensiles</h2>
      <ul class="mt-3 flex flex-wrap gap-2">
        <li th:each="u : ${recipe.utensils}" th:text="${u.name}" class="rounded-full bg-sand px-3 py-1 text-sm"></li>
      </ul>
    </div>
    <ol class="space-y-4 md:col-span-2">
      <li th:each="s : ${recipe.steps}" class="rounded-2xl bg-white p-5 shadow-sm">
        <h3 class="font-bold"><span th:text="${s.stepOrder}"></span>. <span th:text="${s.title}"></span></h3>
        <p class="mt-1" th:text="${s.instruction}"></p>
        <p th:if="${s.tip}" class="mt-2 text-sm text-primary">💡 <span th:text="${s.tip}"></span></p>
      </li>
    </ol>
  </section>

  <section id="reviews">
    <h2 class="text-2xl font-bold">Avis</h2>
    <div class="mt-4 grid gap-6 md:grid-cols-3">
        <div class="text-center">
            <p class="text-5xl font-extrabold" th:text="${#numbers.formatDecimal(recipe.averageRating, 1, 1)}">4,5</p>
            <p class="text-sm text-dark/60"><span th:text="${recipe.reviewCount}"></span> avis</p>
        </div>
        <div class="space-y-1 md:col-span-2">
            <div th:each="e : ${stars}" class="flex items-center gap-2 text-sm">
            <span class="w-10" th:text="${e.key} + ' ★'"></span>
            <div class="h-2 flex-1 rounded bg-sand">
                <div class="h-2 rounded bg-primary"
                    th:style="|width: ${recipe.reviewCount == 0 ? 0 : e.value * 100 / recipe.reviewCount}%|"></div>
            </div>
            <span class="w-6 text-right" th:text="${e.value}"></span>
            </div>
        </div>
    </div>

    <form th:if="${canReview}" th:action="@{/recipes/{id}/reviews(id=${recipe.id})}" th:object="${reviewForm}"method="post" class="mt-6 space-y-3 rounded-2xl bg-white p-5 shadow-sm">
        <select th:field="*{rating}" class="rounded-lg border-sand">
            <option th:each="n : ${#numbers.sequence(5, 1)}" th:value="${n}" th:text="${n} + ' ★'"></option>
        </select>
        <textarea th:field="*{comment}" rows="3" class="w-full rounded-lg border-sand" placeholder="Votre avis…"></textarea>
        <button class="rounded-full bg-primary px-5 py-2 font-semibold text-cream">Publier</button>
    </form>
    <p th:if="${session.user == null}" class="mt-6 text-sm">
    <a th:href="@{/login}" class="text-primary underline">Connectez-vous</a> pour noter cette recette.
    </p>

    <article th:each="rv : ${reviews}" class="mt-4 rounded-2xl bg-white p-5 shadow-sm">
    <p class="font-semibold"><span th:text="${rv.user.username}"></span> · <span th:text="${rv.rating} + ' ★'"></span></p>
    <p class="mt-1" th:text="${rv.comment}"></p>
    <form th:if="${session.user != null and (session.user.id == rv.user.id or session.user.admin)}"
            th:action="@{/recipes/{id}/reviews/{rid}/delete(id=${recipe.id}, rid=${rv.id})}" method="post">
        <button class="mt-2 text-xs text-dark/60 underline">Supprimer</button>
    </form>
    </article>
  </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
