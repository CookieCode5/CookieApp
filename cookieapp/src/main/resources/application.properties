spring.application.name=cookieapp

spring.datasource.url=jdbc:h2:file:./data/cookieapp
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

# ne supprime pas les tables/données
spring.jpa.hibernate.ddl-auto=update
server.port=8081
# --- Configuration pour l'upload d'images (Feature AmiraO) ---
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Mise à jour automatique de la base (pour ajouter category et note) ---
spring.jpa.hibernate.ddl-auto=update