wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip

spring.datasource.url=jdbc:h2:file:./the_db_file
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true

# ne supprime pas les tables/données
spring.jpa.hibernate.ddl-auto=update
# OU:
# /!\ SUPPRIME les tables/données à chaque redémarrage !
spring.jpa.hibernate.ddl-auto=create-drop